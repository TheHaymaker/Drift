<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>drift</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400&display=swap');

  :root {
    --bg: #141210;
    --bg-raised: #1a1814;
    --border: #2a2520;
    --text: #d4c5a9;
    --text-dim: #7a7060;
    --text-faint: #4a4030;
    --accent: #a08c6a;
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── Dashboard ─── */

  .dashboard {
    max-width: 560px;
    margin: 0 auto;
    padding: 80px 32px;
  }

  .dashboard-header {
    margin-bottom: 40px;
  }

  .dashboard-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .dashboard-subtitle {
    font-size: 1.2rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .new-poem-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 32px;
  }

  .new-poem-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(160, 140, 106, 0.08);
  }

  .doc-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .doc-item {
    padding: 14px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 2px solid transparent;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .doc-item:hover {
    background: rgba(160, 140, 106, 0.06);
    border-left-color: var(--border);
  }

  .doc-item-title {
    font-size: 1rem;
    color: var(--text);
  }

  .doc-item-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.52rem;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  .doc-empty {
    color: var(--text-faint);
    font-style: italic;
    padding: 20px 0;
  }

  /* ─── Editor ─── */

  .app {
    display: grid;
    grid-template-columns: 1fr 280px;
    min-height: 100vh;
  }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }

  .editor-pane {
    display: flex;
    flex-direction: column;
    padding: 48px 60px 60px;
    position: relative;
  }

  .editor-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .editor-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-faint);
    cursor: pointer;
    transition: color 0.2s;
  }

  .editor-title:hover { color: var(--accent); }

  .editor-filename {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.64rem;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  .status-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.56rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text-faint);
    transition: all 0.4s ease;
    margin-left: auto;
  }

  .status-pill.typing {
    border-color: rgba(74, 222, 128, 0.3);
    color: var(--green);
    background: rgba(74, 222, 128, 0.06);
  }

  .status-pill.paused {
    border-color: rgba(160, 140, 106, 0.3);
    color: var(--accent);
  }

  .status-pill.committed {
    border-color: rgba(251, 191, 36, 0.4);
    color: var(--amber);
    background: rgba(251, 191, 36, 0.06);
    animation: flash 0.6s ease;
  }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .editor-area {
    flex: 1;
    position: relative;
  }

  textarea {
    width: 100%;
    min-height: 500px;
    height: 100%;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.45rem;
    line-height: 2;
    letter-spacing: 0.01em;
    caret-color: var(--accent);
    padding: 0;
  }

  textarea::placeholder {
    color: var(--text-faint);
    font-style: italic;
  }

  textarea::selection {
    background: rgba(160, 140, 106, 0.2);
  }

  .editor-area::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--border) 10%, var(--border) 90%, transparent);
  }

  .pause-ring {
    position: fixed;
    bottom: 32px;
    left: 60px;
    width: 36px;
    height: 36px;
  }

  .pause-ring svg {
    transform: rotate(-90deg);
    width: 36px;
    height: 36px;
  }

  .pause-ring circle {
    fill: none;
    stroke-width: 2;
  }

  .pause-ring .track { stroke: var(--border); }

  .pause-ring .fill {
    stroke: var(--accent);
    stroke-dasharray: 88;
    stroke-dashoffset: 88;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
  }

  .pause-ring .fill.active {
    transition: stroke-dashoffset 0.1s linear;
  }

  .pause-ring-label {
    position: fixed;
    bottom: 40px;
    left: 106px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.54rem;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }

  .sidebar {
    background: var(--bg-raised);
    border-left: 1px solid var(--border);
    padding: 48px 20px 32px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.56rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 24px;
  }

  .commit-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .commit-count span {
    font-size: 1.8rem;
    font-weight: 300;
    display: block;
    margin-bottom: 2px;
  }

  .commits {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .commit-item {
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 2px solid transparent;
  }

  .commit-item:hover {
    background: rgba(160, 140, 106, 0.06);
    border-left-color: var(--border);
  }

  .commit-item.active {
    background: rgba(160, 140, 106, 0.1);
    border-left-color: var(--accent);
  }

  .commit-item.new {
    animation: slideIn 0.4s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .commit-hash {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  .commit-msg {
    font-family: 'EB Garamond', serif;
    font-size: 0.82rem;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .commit-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.5rem;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .settings {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .setting-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.56rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .setting-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--text-dim);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    margin-top: 6px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    margin-top: 8px;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(160, 140, 106, 0.08);
  }

  .connection {
    position: fixed;
    top: 16px;
    right: 300px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.5rem;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .connection-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background 0.3s;
  }

  .connection-dot.connected { background: var(--green); }
  .connection-dot.disconnected { background: var(--red); }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--amber);
    background: var(--bg-raised);
    border: 1px solid rgba(251, 191, 36, 0.2);
    padding: 8px 20px;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    z-index: 0;
  }

  .editor-pane, .sidebar, .dashboard { z-index: 1; position: relative; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="grain"></div>

<!-- ─── Dashboard View ─── -->
<div class="dashboard" id="dashboardView">
  <div class="dashboard-header">
    <div class="dashboard-title">drift</div>
    <div class="dashboard-subtitle">your poems</div>
  </div>
  <button class="new-poem-btn" id="newPoemBtn">+ new poem</button>
  <div class="doc-list" id="docList">
    <div class="doc-empty">no poems yet. start one.</div>
  </div>
</div>

<!-- ─── Editor View ─── -->
<div class="app hidden" id="editorView">
  <div class="editor-pane">
    <div class="editor-header">
      <span class="editor-title" id="backBtn">drift</span>
      <span class="editor-filename" id="filename">poem.txt</span>
      <span class="status-pill" id="status">connecting</span>
    </div>
    <div class="editor-area">
      <textarea
        id="editor"
        placeholder="begin writing. drift commits when you pause."
        spellcheck="false"
        autofocus
      ></textarea>
    </div>

    <div class="pause-ring" id="pauseRing">
      <svg viewBox="0 0 36 36">
        <circle class="track" cx="18" cy="18" r="14" />
        <circle class="fill" id="pauseFill" cx="18" cy="18" r="14" />
      </svg>
    </div>
    <div class="pause-ring-label" id="pauseLabel">pause &rarr; commit</div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">commit history</div>
    <div class="commit-count">
      <span id="commitCountNum">0</span>
      snapshots
    </div>
    <div class="commits" id="commitList"></div>

    <div class="settings">
      <div class="setting-row">
        <span class="setting-label">pause threshold</span>
        <span class="setting-value" id="thresholdValue">3.0s</span>
      </div>
      <input type="range" id="thresholdSlider" min="500" max="15000" step="250" value="3000">
      <button class="btn" id="forceCommitBtn">commit now</button>
      <button class="btn" id="exportBtn" style="margin-top: 4px;">export history</button>
    </div>
  </div>
</div>

<div class="connection hidden" id="connStatus">
  <div class="connection-dot" id="connDot"></div>
  <span id="connLabel">connecting</span>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  // ─── DOM refs ───
  const dashboardView = document.getElementById("dashboardView");
  const editorView = document.getElementById("editorView");
  const connStatus = document.getElementById("connStatus");
  const docList = document.getElementById("docList");
  const newPoemBtn = document.getElementById("newPoemBtn");
  const backBtn = document.getElementById("backBtn");
  const editor = document.getElementById("editor");
  const status = document.getElementById("status");
  const filenameEl = document.getElementById("filename");
  const commitList = document.getElementById("commitList");
  const commitCountNum = document.getElementById("commitCountNum");
  const thresholdSlider = document.getElementById("thresholdSlider");
  const thresholdValue = document.getElementById("thresholdValue");
  const forceCommitBtn = document.getElementById("forceCommitBtn");
  const exportBtn = document.getElementById("exportBtn");
  const pauseFill = document.getElementById("pauseFill");
  const pauseLabel = document.getElementById("pauseLabel");
  const connDot = document.getElementById("connDot");
  const connLabel = document.getElementById("connLabel");
  const toast = document.getElementById("toast");

  let ws;
  let currentDocId = null;
  let pauseThreshold = 3000;
  let lastKeystroke = 0;
  let animFrame;
  let isTyping = false;
  let commitLog = [];

  // ─── Router ───

  function getRoute() {
    const hash = location.hash || "#/";
    const writeMatch = hash.match(/^#\/write\/(.+)$/);
    if (writeMatch) return { view: "write", docId: writeMatch[1] };
    const readMatch = hash.match(/^#\/read\/(.+)$/);
    if (readMatch) return { view: "read", docId: readMatch[1] };
    return { view: "dashboard" };
  }

  function navigate(hash) {
    location.hash = hash;
  }

  function route() {
    const r = getRoute();
    if (r.view === "write") {
      showEditor(r.docId);
    } else if (r.view === "read") {
      showEditor(r.docId, true);
    } else {
      showDashboard();
    }
  }

  window.addEventListener("hashchange", route);

  // ─── Dashboard ───

  function showDashboard() {
    disconnectWs();
    currentDocId = null;
    dashboardView.classList.remove("hidden");
    editorView.classList.add("hidden");
    connStatus.classList.add("hidden");
    document.title = "drift";
    loadDocList();
  }

  async function loadDocList() {
    try {
      const docs = await fetch("/api/documents").then(r => r.json());
      docList.innerHTML = "";
      if (docs.length === 0) {
        docList.innerHTML = '<div class="doc-empty">no poems yet. start one.</div>';
        return;
      }
      for (const doc of docs) {
        const div = document.createElement("div");
        div.className = "doc-item";
        const modified = doc.last_modified ? new Date(doc.last_modified + "Z").toLocaleDateString() : "";
        div.innerHTML = `
          <span class="doc-item-title">${escapeHtml(doc.title || "untitled")}</span>
          <span class="doc-item-meta">${escapeHtml(doc.filename)} &middot; ${modified}</span>
        `;
        div.addEventListener("click", () => navigate("#/write/" + doc.doc_id));
        docList.appendChild(div);
      }
    } catch (e) {
      docList.innerHTML = '<div class="doc-empty">failed to load documents</div>';
    }
  }

  newPoemBtn.addEventListener("click", async () => {
    try {
      const res = await fetch("/api/documents", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      const data = await res.json();
      navigate("#/write/" + data.docId);
    } catch (e) {
      showToast("failed to create poem");
    }
  });

  backBtn.addEventListener("click", () => navigate("#/"));

  // ─── Editor ───

  function showEditor(docId, readOnly) {
    if (currentDocId === docId && ws && ws.readyState === 1) return;
    currentDocId = docId;
    dashboardView.classList.add("hidden");
    editorView.classList.remove("hidden");
    connStatus.classList.remove("hidden");
    editor.readOnly = !!readOnly;
    editor.placeholder = readOnly
      ? "reading..."
      : "begin writing. drift commits when you pause.";
    document.title = "drift — writing";
    connectWs(docId);
  }

  function disconnectWs() {
    if (ws) {
      ws.onclose = null;
      ws.close();
      ws = null;
    }
  }

  function connectWs(docId) {
    disconnectWs();
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}`);

    ws.onopen = () => {
      connDot.className = "connection-dot connected";
      connLabel.textContent = "connected";
      status.textContent = "joining";
      status.className = "status-pill";
      // Send join message with docId
      ws.send(JSON.stringify({ type: "join", docId }));
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === "init") {
        editor.value = msg.content;
        filenameEl.textContent = msg.filename;
        pauseThreshold = msg.pauseThreshold;
        thresholdSlider.value = pauseThreshold;
        thresholdValue.textContent = (pauseThreshold / 1000).toFixed(1) + "s";
        renderCommits(msg.log);
        status.textContent = "ready";
        status.className = "status-pill";
        if (!editor.readOnly) editor.focus();
      }

      if (msg.type === "committed") {
        status.textContent = "committed " + msg.hash;
        status.className = "status-pill committed";
        renderCommits(msg.log, msg.hash);
        showToast(msg.hash + " \u2014 " + msg.message);
        setTimeout(() => {
          status.textContent = "ready";
          status.className = "status-pill";
        }, 2000);
      }

      if (msg.type === "threshold-changed") {
        pauseThreshold = msg.value;
        thresholdSlider.value = msg.value;
        thresholdValue.textContent = (msg.value / 1000).toFixed(1) + "s";
      }

      if (msg.type === "error") {
        showToast(msg.message);
      }
    };

    ws.onclose = () => {
      connDot.className = "connection-dot disconnected";
      connLabel.textContent = "disconnected";
      status.textContent = "offline";
      status.className = "status-pill";
      // Only reconnect if still viewing this document
      if (getRoute().docId === docId) {
        setTimeout(() => connectWs(docId), 3000);
      }
    };

    ws.onerror = () => ws.close();
  }

  // ─── Pause ring ───

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function updateRing() {
    const now = Date.now();
    const elapsed = now - lastKeystroke;

    if (isTyping && elapsed < pauseThreshold) {
      const progress = elapsed / pauseThreshold;
      const offset = 88 * (1 - progress);
      pauseFill.style.strokeDashoffset = offset;
      pauseFill.classList.add("active");
      pauseLabel.textContent = ((pauseThreshold - elapsed) / 1000).toFixed(1) + "s \u2192 commit";
    } else if (isTyping && elapsed >= pauseThreshold) {
      pauseFill.style.strokeDashoffset = 0;
      isTyping = false;
    } else {
      pauseFill.style.strokeDashoffset = 88;
      pauseFill.classList.remove("active");
      pauseLabel.textContent = "pause \u2192 commit";
    }

    animFrame = requestAnimationFrame(updateRing);
  }
  animFrame = requestAnimationFrame(updateRing);

  // ─── Commits ───

  function renderCommits(log, newHash) {
    commitLog = log;
    commitCountNum.textContent = log.length;
    commitList.innerHTML = "";

    const reversed = [...log].reverse();
    for (const c of reversed) {
      const div = document.createElement("div");
      div.className = "commit-item" + (c.hash === newHash ? " new" : "");
      div.innerHTML =
        '<div class="commit-hash">' + c.hash + '</div>' +
        '<div class="commit-msg">' + escapeHtml(c.message) + '</div>' +
        '<div class="commit-time">#' + (c.index + 1) + '</div>';
      div.addEventListener("click", () => {
        fetch("/api/documents/" + currentDocId + "/snapshot/" + c.hash)
          .then(r => r.json())
          .then(d => {
            editor.value = d.content;
            document.querySelectorAll(".commit-item").forEach(el => el.classList.remove("active"));
            div.classList.add("active");
            showToast("viewing " + c.hash);
          });
      });
      commitList.appendChild(div);
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ─── Editor events ───

  editor.addEventListener("input", () => {
    if (editor.readOnly) return;
    lastKeystroke = Date.now();
    isTyping = true;
    status.textContent = "writing";
    status.className = "status-pill typing";

    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "update", content: editor.value }));
    }
  });

  editor.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const start = editor.selectionStart;
      editor.value = editor.value.slice(0, start) + "  " + editor.value.slice(editor.selectionEnd);
      editor.selectionStart = editor.selectionEnd = start + 2;
      editor.dispatchEvent(new Event("input"));
    }
  });

  thresholdSlider.addEventListener("input", () => {
    const val = parseInt(thresholdSlider.value);
    thresholdValue.textContent = (val / 1000).toFixed(1) + "s";
    pauseThreshold = val;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "set-threshold", value: val }));
    }
  });

  forceCommitBtn.addEventListener("click", () => {
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "force-commit" }));
    }
  });

  exportBtn.addEventListener("click", async () => {
    if (!currentDocId) return;
    try {
      const log = await fetch("/api/documents/" + currentDocId + "/log").then(r => r.json());
      const snapshots = [];
      for (const c of log) {
        const snap = await fetch("/api/documents/" + currentDocId + "/snapshot/" + c.hash).then(r => r.json());
        snapshots.push({ ...c, content: snap.content });
      }
      const blob = new Blob([JSON.stringify(snapshots, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "drift-export-" + Date.now() + ".json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("exported " + log.length + " snapshots");
    } catch (e) {
      showToast("export failed");
    }
  });

  editor.addEventListener("blur", () => {
    status.textContent = "paused";
    status.className = "status-pill paused";
  });

  editor.addEventListener("focus", () => {
    if (!currentDocId) return;
    document.querySelectorAll(".commit-item").forEach(el => el.classList.remove("active"));
    if (ws && ws.readyState === 1) {
      fetch("/api/documents/" + currentDocId + "/file").then(r => r.json()).then(d => {
        editor.value = d.content;
      });
    }
    status.textContent = "ready";
    status.className = "status-pill";
  });

  // ─── Init: route on load ───
  route();
})();
</script>
</body>
</html>
