app = "drift-poems"
primary_region = "ord"

[build]

[env]
  DRIFT_DATA_DIR = "/data"

[http_service]
  internal_port = 3377
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "drift_data"
  destination = "/data"
