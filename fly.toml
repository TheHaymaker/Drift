# fly.toml app configuration file generated for app-cool-sun-1542 on 2026-03-22T04:38:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'app-cool-sun-1542'
primary_region = 'iad'

[build]

[env]
  DRIFT_DATA_DIR = "/data"

[mounts]
  source = "drift_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
